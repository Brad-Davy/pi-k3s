apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-dns
  namespace: home-dns
spec:
  ingressClassName: traefik
  rules:
    - host: home-dns.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-dns
                port:
                  number: 8080
