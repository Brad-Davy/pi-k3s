apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Brad-Davy/pi-k3s.git
    targetRevision: main
    path: apps/pihole

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
