apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-dns
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Brad-Davy/pi-k3s.git
    targetRevision: main
    path: apps/home-dns

  destination:
    server: https://kubernetes.default.svc
    namespace: home-dns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
